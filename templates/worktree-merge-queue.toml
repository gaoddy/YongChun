# Worktree 合并队列交付配置模板
#
# 使用方式：
# 1. 复制到项目根 `.yongchun/worktree-merge-queue.toml`；Codex 兼容位置为
#    `.codex/worktree-merge-queue-delivery.toml`。
# 2. 替换全部 <...> 为项目实际值。
# 3. 删除未启用的段与未使用的注释项。
# 4. 字段与流程见 runbooks/delivery/worktree-delivery.md。
#
# 命令模板占位符：{branch} {base_branch} {stage} {repo_path} {commit} {manifest}
# {manifest} 由 helper 按 shell 参数引用，命令模板中不要给占位符加引号。
#
# 交付顺序固定：验证 → 合并 base_branch → 清理任务 worktree 与任务分支 → 释放队列 →
# 独立 worker 在合并 commit 上推送、部署与上传。不支持先部署任务分支或任务 worktree。
#
# 预演校验：
# python3 <插件根>/skills/worktree-merge-queue-delivery/scripts/delivery_helper.py plan \
#   --config .yongchun/worktree-merge-queue.toml \
#   --branch <任务分支> --root <任务 worktree 绝对路径>

[project]
name = "<项目名>"
base_branch = "develop"
branch_prefix = "<任务分支前缀，如 task/>"

[worktree]
create = "git worktree add -b {branch} ../{branch} {base_branch}"
# clean 必须同时移除 worktree 并删除任务分支，合并后由 run 自动执行。
clean = "git worktree remove --force ../{branch} && git branch -D {branch}"
list = "git worktree list"
verify = "<任务 worktree 校验命令>"

[delivery]
merge_base = "git merge --ff-only {branch}"
push_base = "git push origin {base_branch}"
push_commit = "git push origin {commit}:refs/heads/{base_branch}"

# 合并队列：run 必须配置 queue.release_after_merge；仅在只做 plan 预演或改用手工交付时
# 才可删除本段，并同步删除各 repos 中的 queue_advance_after_*。
# stages 只列验证与本地集成阶段，最后一项作为根仓合并阶段。
[queue]
enabled = true
stages = ["verified", "children-merged", "root-merged"]
status = "<队列状态命令>"
enqueue = "<入队命令> {branch}"
claim = "<认领命令> {branch}"
require_active = "<占用校验命令> {branch}"
advance = "<阶段推进命令> {branch} {stage}"
require_stage = "<阶段校验命令> {branch} {stage}"
drop = "<出队命令> {branch}"
# 必填：本地合并完成后释放占位；可用占位符：{branch} {base_branch} {commit} {manifest}。
release_after_merge = "<释放占位命令> {branch} {commit} {manifest}"

# 独立交付：存在 push_base、deploy、upload 或 post_delivery_checks 时必填。
# worker 只在基线合并后执行，命令中的 {commit} 是 base_branch 的合并 commit；
# 每条推送、部署、上传与检查命令都必须含 {commit}，不得指向任务分支或任务 worktree。
[post_merge]
enqueue = "<交付入队命令> {manifest}"

# 仓库：子仓在前、根仓最后；repos 的书写顺序即合并顺序。
# needs 填依赖仓库的 name；单仓项目只保留根仓。
[[repos]]
name = "<子仓名>"
path = "<子仓相对项目根的路径>"
role = "<角色，如 server>"
needs = []
verify = ["<定向验证命令>", "<全量验证命令>"]
merge_base = true
push_base = true
queue_advance_after_verify = "verified"
queue_advance_after_merge = "children-merged"
# sdk_generate = "<按契约生成客户端 SDK 的命令>"
# deploy = "<在 base_branch 合并 commit 上执行的部署命令，必须含 {commit}>"
# upload = "<在 base_branch 合并 commit 上执行的上传命令，必须含 {commit}>"
# post_delivery_checks = ["<在 base_branch 合并 commit 上执行的检查命令，必须含 {commit}>"]

[[repos]]
name = "root"
path = "."
role = "root"
needs = ["<子仓名>"]
verify = ["<根仓验证命令>"]
merge_base = true
push_base = true
queue_advance_after_merge = "root-merged"
